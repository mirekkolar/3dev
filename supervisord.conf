; supervisord.conf — runs the 3 services of the CadQuery + KiCad dev container.
;
; - cadquery-server : live 3D model preview (cq-server, built into the base image)
; - kicad-web       : live KiCad schematic/PCB preview (KiCanvas-based, see kicad_web_server.py)
; - watcher         : watches /app for edited KiCad files (-> SVG) and CadQuery model .py files
;                     (-> STL + PNG) and auto-exports them (watcher.py, model_export.py)

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:cadquery-server]
command=cq-server run %(ENV_CQ_MODELS_DIR)s -p %(ENV_CQ_PORT)s --ui-theme dark
directory=%(ENV_APP_DIR)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kicad-web]
command=python3 /opt/kicad-web/kicad_web_server.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:watcher]
command=python3 /opt/watcher/watcher.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
