services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirekkolar/3dev:test
    ports:
      - "${CQ_PORT:-5000}:5000"
      - "${KICAD_PORT:-8000}:8000"
    environment:
      - CQ_PORT=5000
      - KICAD_PORT=8000
      - APP_DIR=${APP_DIR:-/app}
      - CQ_MODELS_DIR=${CQ_MODELS_DIR:-/app/models}
      - WATCHER_DEBOUNCE_SECONDS=${WATCHER_DEBOUNCE_SECONDS:-1.0}
    volumes:
      - ./project:${APP_DIR:-/app}
